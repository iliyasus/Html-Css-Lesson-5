<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="buttons">
        <a href="#">Сохранить</a>
        <a href="#">Изменить</a>
        <a href="#">Удалить</a>
    </div>

    <table >
        <tbody>
            <tr>
                <th>№</th>
                <th>Имя</th>
                <th>Группа</th>
                <th>Оценка</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Анна</td>
                <td>252/1P</td>
                <td>4</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Максим</td>
                <td>252/1P</td>
                <td>5</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Иван</td>
                <td>252/1P</td>
                <td>4</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Алина</td>
                <td>252/1P</td>
                <td>5</td>
            </tr>
        </tbody>
    </table>
    <input type="text" placeholder="Введите имя">
    <input type="password" placeholder="Введите пароль">
    <div class="login">
        <h1>Вход</h1>
        <p>Войдите в аккаунт</p>
        <div class="login-form">
            <span>Логин</span>
            <input type="text" id="login" placeholder="Введите логин">
            <span>Пароль</span>
            <input type="password" id="password" placeholder="Введите пароль">
            <div class="remember">
                <input type="checkbox" id="remember">
                <span>Запомнить меня</span>
            </div>
            <button>Войти</button>
            <a href="#">Забыли пароль?</a>
            

        </div>
    </div>

</body>

</html>
