<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-block1">
            <div class="logo">
                <img src="images/Logo.png" alt="Logo">
                <h1>Organic</h1>
            </div>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Pages</a>
                <a href="#">Shop</a>
                <a href="#">Projects</a>
                <a href="#">News</a>
            </nav>
        </div>
        <div class="header-block2">
            <img src="images/search.jpg" alt="Search">
            <div class="cartBtn">
                <img src="images/cart.jpg" alt="Cart">
                <span>Cart (0)</span>
            </div>

            
        </div>
    </header>
    <div class="banner">
        <div class="content">
            <div class="title">
                <h3>100% Natural Food</h3>
                <h1>Choose the best<br>healthier way<br>of life</h1>
            </div>
            <div class="button">Explore Now ▶️</div>
        </div>
    </div>
    <div class="offer-banner">
        <div class = "offer-banner-1">
            <div class = "text">
                <h2>Natural!!</h2>
                <h1>Get Garden Fresh Fruits</h1>
            </div>
            

        </div>
        <div class = "offer-banner-2">
            <div class = "text">
                <h2>Offer!!</h2>
                <h1>Get 10% off on Vegetables</h1>
            </div>
            
        </div>
    </div>
    <section class="gallery">
        <div class="gallery-card">
            <img src="images/organic-juice.png" alt="Organic juice">
            <div class="gallery-text">Organic Juice</div>
        </div>
        <div class="gallery-card">
            <img src="images/organic-food.png" alt="Fresh organic food">
            <div class="gallery-text">Organic Food</div>
        </div>
        <div class="gallery-card">
            <img src="images/nuts-cookies.png" alt="Nuts and cookies">
            <div class="gallery-text">Nuts Cookies</div>
        </div>
    </section>
</body>
</html>
